name: Frontend Quality

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-quality.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "src/**"
      - "tests/**"
      - "scripts/check-chart-boundaries.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-quality.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "postcss.config.mjs"
      - "vitest.config.ts"
      - "playwright.config.ts"
      - "src/**"
      - "tests/**"
      - "scripts/check-chart-boundaries.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate onboarding journey
        run: npm run test:e2e
