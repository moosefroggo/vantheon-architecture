  text-decoration: none;

  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;

h1,

h6,
p {

h5,

b,

  width: 100%;
  padding: 0;

  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;

    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {

  color: var(--accent-foreground);
  background: var(--accent);

.sr-only {

  clip: rect(0, 0, 0, 0);

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

}

.btn-primary {

.btn-primary:not(:disabled):hover {

}

  color: var(--muted-foreground);
  background: transparent;

.btn-ghost:not(:disabled):hover {

.btn:disabled {

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,

  padding: 0 32px 0 8px;
  outline: none;

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  background-color: var(--secondary);

  background-size: 4px 4px;

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

  height: 100%;

  height: 14px;

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;

  padding: 0;

  background: linear-gradient(

  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

      var header = &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-run-head&quot;&gt;&lt;div class=&quot;pew-run-title&quot;&gt;&lt;span class=&quot;pew-inline&quot;&gt;&#x27; + dot(running) + &#x27;&lt;span&gt;&#x27; + status + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;h2&gt;&#x27; + (isDry ? &#x27;Dry Run &#x27; : &#x27;Run &#x27;) + context.id + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;pew-run-controls&quot;&gt;&#x27; + stop + &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Improve in Draft&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pew-run-meta&quot;&gt;&lt;span&gt;&#x27; + (running ? &#x27;7s elapsed&#x27; : &#x27;8m 54s elapsed&#x27;) + &#x27;&lt;/span&gt;&lt;span&gt;&#x27; + (running ? &#x27;—&#x27; : &#x27;0&#x27;) + &#x27; orders&lt;/span&gt;&lt;span&gt;$&#x27; + (isDry ? &#x27;10,000&#x27; : &#x27;37,970&#x27;) + &#x27; buying power&lt;/span&gt;&lt;span&gt;Strategy &#x27; + (isDry ? &#x27;Draft V6.4&#x27; : &#x27;V5&#x27;) + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&#x27;;
      return breadcrumb + nav + header + (runTab === &quot;activity&quot; ? renderActivity(isDry, running) : renderRunSummary(isDry, running));
    }

    function renderRunSummary(isDry, running) {
      if (running) return &#x27;&lt;section class=&quot;pew-verdict&quot;&gt;&lt;div class=&quot;pew-verdict-main&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Current stage&lt;/span&gt;&lt;strong&gt;Loading market evidence&lt;/strong&gt;&lt;span&gt;2 skills discovered · portfolio snapshot queued&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&#x27; + table([&quot;Input&quot;, &quot;State&quot;, &quot;Cutoff&quot;], [[&quot;Buying power&quot;, &quot;$10,000&quot;, &quot;Current&quot;], [&quot;Positions&quot;, &quot;0&quot;, &quot;Current&quot;], [&quot;Fundamentals&quot;, &quot;Loading&quot;, &quot;—&quot;]], &quot;Dry run inputs&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;
      return &#x27;&lt;section class=&quot;pew-verdict&quot;&gt;&lt;div class=&quot;pew-verdict-main&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Outcome&lt;/span&gt;&lt;strong&gt;No order&lt;/strong&gt;&lt;span&gt;Three candidates reached portfolio checks. Existing constraints blocked all three.&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Portfolio impact · $0 · positions unchanged&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;pew-trace-head&quot;&gt;&lt;strong&gt;Decision trace&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;40 → 3 → 0&lt;/span&gt;&lt;/div&gt;&#x27; + table([&quot;Candidate&quot;, &quot;Passed&quot;, &quot;Blocked by&quot;], [[&quot;MSFT&quot;, &quot;Entry&quot;, &quot;20% position cap&quot;], [&quot;NVDA&quot;, &quot;Entry&quot;, &quot;Earnings window&quot;], [&quot;GOOGL&quot;, &quot;Entry&quot;, &quot;Cash floor&quot;]], &quot;Decision trace&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;pew-section&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Provenance&lt;/span&gt;&lt;h3&gt;Exact inputs&lt;/h3&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot;&gt;Open Strategy V5&lt;/button&gt;&lt;/div&gt;&#x27; + table([&quot;Source&quot;, &quot;Identity&quot;, &quot;Cutoff&quot;], [[&quot;Strategy&quot;, isDry ? &quot;Draft V6 · checkpoint V6.4&quot; : &quot;Immutable Strategy V5 · source V5.7&quot;, &quot;Frozen at start&quot;], [&quot;Market data&quot;, &quot;Daily adjusted bars&quot;, &quot;Jul 15 · 3:00 PM&quot;], [&quot;Portfolio&quot;, isDry ? &quot;Dry-run sandbox&quot; : &quot;Growth test&quot;, &quot;Run start&quot;]], &quot;Run provenance&quot;) + &#x27;&lt;/section&gt;&#x27;;
    }

    function renderActivity(isDry, running) {
      var events = running ? [
        [&quot;00:00&quot;, &quot;○&quot;, &quot;Run started&quot;, &quot;Draft V6 · checkpoint V6.4 pinned&quot;],
        [&quot;00:01&quot;, &quot;○&quot;, &quot;Skills discovered&quot;, &quot;market-data · trade-execution&quot;],

        [&quot;00:07&quot;, &quot;◌&quot;, &quot;Market data&quot;, &quot;Loading daily bars…&quot;]
      ] : [
        [&quot;15:00:00&quot;, &quot;○&quot;, &quot;Run started&quot;, &quot;Strategy V5 and Growth test snapshot pinned&quot;],
        [&quot;15:00:01&quot;, &quot;○&quot;, &quot;Skills discovered&quot;, &quot;market-data.md · trade-execution.md&quot;],
        [&quot;15:00:03&quot;, &quot;○&quot;, &quot;Buying power read&quot;, &quot;$37,970 available to deploy&quot;],
        [&quot;15:00:04&quot;, &quot;○&quot;, &quot;Positions read&quot;, &quot;6 open positions · 64% deployed&quot;],
        [&quot;15:01:12&quot;, &quot;○&quot;, &quot;Fundamentals loaded&quot;, &quot;40 / 40 universe members&quot;],
        [&quot;15:05:46&quot;, &quot;○&quot;, &quot;Candidate screen&quot;, &quot;3 passed entry rules&quot;],
        [&quot;15:08:41&quot;, &quot;○&quot;, &quot;Decision&quot;, &quot;No order · constraints held&quot;],
        [&quot;15:08:54&quot;, &quot;○&quot;, &quot;Completed&quot;, &quot;Portfolio unchanged&quot;]
      ];
      return &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-trace-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Authoritative execution log&lt;/span&gt;&lt;h3&gt;Activity&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + (running ? &#x27;Streaming&#x27; : &#x27;Complete&#x27;) + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pew-trace&quot;&gt;&#x27; + events.map(function (event) { return &#x27;&lt;div class=&quot;pew-trace-row&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + event[0] + &#x27;&lt;/span&gt;&lt;span class=&quot;pew-trace-mark&quot;&gt;&#x27; + event[1] + &#x27;&lt;/span&gt;&lt;div class=&quot;pew-trace-copy&quot;&gt;&lt;strong&gt;&#x27; + event[2] + &#x27;&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + event[3] + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;; }).join(&quot;&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;
    }

    function renderDraft(item) {
      if (runDetail) return renderRunDetail(runDetail);
      var body;
      if (localView === &quot;tests&quot;) {
        body = &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Pinned to &#x27; + item.checkpoint + &#x27;&lt;/span&gt;&lt;h3&gt;Tests&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;pew-run-controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Backtest&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot;&gt;Dry run&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27; + table([&quot;Evaluation&quot;, &quot;State&quot;, &quot;Started&quot;, &quot;Outcome&quot;], [[&#x27;&lt;button type=&quot;button&quot; class=&quot;pew-row-button&quot; data-open-dry=&quot;13&quot;&gt;Dry Run 13&lt;/button&gt;&#x27;, &quot;Running&quot;, &quot;7s ago&quot;, &quot;Loading evidence&quot;], [&#x27;&lt;button type=&quot;button&quot; class=&quot;pew-row-button&quot; data-open-dry=&quot;12&quot;&gt;Dry Run 12&lt;/button&gt;&#x27;, &quot;Completed&quot;, &quot;Yesterday&quot;, &quot;No trade · constraints held&quot;], [&quot;Backtest 18&quot;, &quot;Completed&quot;, &quot;Jul 14&quot;, &quot;+11.8% · drawdown 8.4%&quot;]], &quot;Draft tests&quot;) + &#x27;&lt;/section&gt;&#x27;;
      } else if (localView === &quot;history&quot;) {
        body = &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Restorable checkpoints&lt;/span&gt;&lt;h3&gt;History&lt;/h3&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Compare&lt;/button&gt;&lt;/div&gt;&#x27; + table([&quot;Checkpoint&quot;, &quot;Created&quot;, &quot;Change&quot;, &quot;Evidence&quot;], [[&quot;V6.4&quot;, &quot;Today&quot;, &quot;3 current changes&quot;, &quot;Untested&quot;], [&quot;V6.3&quot;, &quot;Jul 14&quot;, &quot;Concentration limits&quot;, &quot;Dry Run 12&quot;], [&quot;V6.0&quot;, &quot;Base&quot;, &quot;Cloned from Strategy V5&quot;, &quot;V5.7&quot;]], &quot;Draft checkpoints&quot;) + &#x27;&lt;/section&gt;&#x27;;
      } else if (localView === &quot;data&quot;) {
        body = &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Inputs and cutoffs&lt;/span&gt;&lt;h3&gt;Data&lt;/h3&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Manage&lt;/button&gt;&lt;/div&gt;&#x27; + table([&quot;Dataset&quot;, &quot;Coverage&quot;, &quot;Latest&quot;], [[&quot;Daily prices&quot;, &quot;Adjusted OHLCV&quot;, &quot;Jul 15&quot;], [&quot;Fundamentals&quot;, &quot;Quarterly company data&quot;, &quot;Q1&quot;], [&quot;Benchmark&quot;, &quot;S&amp;P 500 total return&quot;, &quot;Jul 15&quot;]], &quot;Strategy datasets&quot;) + &#x27;&lt;/section&gt;&#x27;;
      } else {
        body = &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Editable · autosaved&lt;/span&gt;&lt;h3&gt;Structured strategy&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;pew-run-controls&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Edit rule&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-local=&quot;tests&quot;&gt;Test&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;table class=&quot;pew-editor&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;Strategy rules&lt;/caption&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td class=&quot;pew-line&quot;&gt;12&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;Universe&lt;/th&gt;&lt;td&gt;40 liquid U.S. large-cap equities&lt;/td&gt;&lt;td class=&quot;pew-evidence text-small text-muted&quot;&gt;BT-18 · passed&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;pew-line&quot;&gt;19&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;Entry&lt;/th&gt;&lt;td&gt;Top quartile · 6-month momentum&lt;/td&gt;&lt;td class=&quot;pew-evidence text-small text-muted&quot;&gt;Untested&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;pew-line&quot;&gt;31&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;Portfolio&lt;/th&gt;&lt;td&gt;Equal weight · 8 positions maximum&lt;/td&gt;&lt;td class=&quot;pew-evidence text-small text-muted&quot;&gt;DR-12 · passed&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;pew-line&quot;&gt;44&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;Risk&lt;/th&gt;&lt;td&gt;12% per asset · 10% minimum cash&lt;/td&gt;&lt;td class=&quot;pew-evidence text-small text-muted&quot;&gt;Untested&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td class=&quot;pew-line&quot;&gt;57&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;Exit&lt;/th&gt;&lt;td&gt;Momentum reversal or 9% trailing stop&lt;/td&gt;&lt;td class=&quot;pew-evidence text-small text-muted&quot;&gt;BT-18 · passed&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/section&gt;&#x27;;
      }
      return renderDraftNav() + body;
    }

    function renderPortfolio(portfolio, isLive, strategy) {
      if (runDetail) return renderRunDetail(runDetail);
      var identity = isLive ? &#x27;Live portfolio&#x27; : &#x27;Paper · &#x27; + portfolio.name;
      var version = isLive ? portfolio.strategyVersion : portfolio.version;
      var source = isLive ? portfolio.checkpoint : portfolio.source;
      var title = &#x27;&lt;div class=&quot;pew-title-row&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;&#x27; + identity + &#x27;&lt;/p&gt;&lt;h2&gt;&#x27; + (isLive ? &#x27;Live portfolio&#x27; : portfolio.name) + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;pew-inline&quot;&gt;&#x27; + dot(isLive || portfolio.state === &quot;Running&quot;) + (isLive ? &#x27;Active&#x27; : portfolio.state) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
      var provenance = &#x27;&lt;div class=&quot;pew-provenance&quot;&gt;&lt;div class=&quot;pew-trail&quot;&gt;&lt;strong&gt;&#x27; + (isLive ? portfolio.strategy : strategy.name) + &#x27; Strategy &#x27; + version + &#x27;&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;←&lt;/span&gt;&lt;span&gt;Draft checkpoint &#x27; + source + &#x27;&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;&#x27; + (isLive ? &#x27;Live capital&#x27; : &#x27;Simulated&#x27;) + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot;&gt;Open frozen strategy&lt;/button&gt;&lt;/div&gt;&#x27;;
      var body = localView === &quot;positions&quot; ? renderPositions() : localView === &quot;orders&quot; ? renderOrders() : localView === &quot;runs&quot; ? renderRuns(portfolio, isLive ? &quot;Live&quot; : &quot;Paper&quot;) : localView === &quot;risk&quot; ? renderRisk() : renderOverview(portfolio, isLive);
      return title + provenance + renderPortfolioNav(isLive) + &#x27;&lt;section class=&quot;pew-pane&quot;&gt;&#x27; + body + &#x27;&lt;/section&gt;&#x27;;
    }

    function attachEvents() {
      root.querySelectorAll(&quot;[data-env]&quot;).forEach(function (control) {
        control.addEventListener(&quot;click&quot;, function () {
          var kind = control.getAttribute(&quot;data-env&quot;);
          environment = kind === &quot;draft&quot; ? { kind: &quot;draft&quot;, paperId: null } : { kind: &quot;paper&quot;, paperId: control.getAttribute(&quot;data-paper&quot;) };
          localView = kind === &quot;draft&quot; ? &quot;strategy&quot; : &quot;overview&quot;;
          runDetail = null;
          render();
        });
      });
      root.querySelectorAll(&quot;[data-local]&quot;).forEach(function (control) {
        control.addEventListener(&quot;click&quot;, function () {
          var next = control.getAttribute(&quot;data-local&quot;);
          if (next === &quot;run-summary&quot; || next === &quot;run-activity&quot;) runTab = next === &quot;run-summary&quot; ? &quot;summary&quot; : &quot;activity&quot;;
          else localView = next;
          render();
        });
      });
      root.querySelectorAll(&quot;[data-jump]&quot;).forEach(function (control) { control.addEventListener(&quot;click&quot;, function () { localView = control.getAttribute(&quot;data-jump&quot;); render(); }); });
      root.querySelectorAll(&quot;[data-open-run]&quot;).forEach(function (control) { control.addEventListener(&quot;click&quot;, function () { runDetail = { type: environment.kind === &quot;live&quot; ? &quot;live&quot; : &quot;paper&quot;, id: Number(control.getAttribute(&quot;data-open-run&quot;)), parent: environment.kind === &quot;live&quot; ? &quot;Live / Runs&quot; : selectedPaper().name + &quot; / Runs&quot; }; runTab = &quot;summary&quot;; render(); }); });
      root.querySelectorAll(&quot;[data-open-dry]&quot;).forEach(function (control) { control.addEventListener(&quot;click&quot;, function () { runDetail = { type: &quot;dry&quot;, id: Number(control.getAttribute(&quot;data-open-dry&quot;)) }; runTab = &quot;summary&quot;; render(); }); });
      var back = root.querySelector(&quot;[data-back-run]&quot;);
      if (back) back.addEventListener(&quot;click&quot;, function () { localView = runDetail.type === &quot;dry&quot; ? &quot;tests&quot; : &quot;runs&quot;; runDetail = null; render(); });
      var stop = root.querySelector(&quot;#pew-stop&quot;);
      if (stop) stop.addEventListener(&quot;click&quot;, function () { stop.textContent = &quot;Stopping…&quot;; stop.disabled = true; });
    }

    function render() {
      renderSidebar();
      var current = champion();
      var item = selectedStrategy();
      writeTarget.textContent = item.name + &#x27; · &#x27; + item.draft + &#x27; · &#x27; + item.checkpoint;
      var html;
      if (environment.kind === &quot;live&quot;) {
        if (!current.live.strategy) {
          html = &#x27;&lt;div class=&quot;pew-title-row&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Champion capital&lt;/p&gt;&lt;h2&gt;Live portfolio&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;pew-inline&quot;&gt;&#x27; + dot(false) + &#x27;Not activated&lt;/span&gt;&lt;/div&gt;&lt;section class=&quot;pew-pane&quot;&gt;&lt;div class=&quot;pew-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;No deployment&lt;/span&gt;&lt;h3&gt;$0 at risk&lt;/h3&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Review Paper evidence&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&#x27;;
          viewing.textContent = &#x27;Live · Not activated&#x27;;
          topState.textContent = &#x27;Live · Not activated&#x27;;
        } else {
          html = renderPortfolio(current.live, true, item);
          viewing.textContent = runDetail ? &#x27;Live · Run &#x27; + runDetail.id : &#x27;Live · &#x27; + current.live.strategy + &#x27; &#x27; + current.live.strategyVersion;
          topState.textContent = viewing.textContent;
        }
      } else {
        html = renderStrategyHeader(item) + renderEnvironments(item);
        if (environment.kind === &quot;draft&quot;) {
          html += renderDraft(item);
          viewing.textContent = runDetail ? item.name + &#x27; · Dry Run &#x27; + runDetail.id : item.name + &#x27; · &#x27; + item.draft + &#x27; · &#x27; + item.checkpoint;
        } else {
          var paper = selectedPaper();
          html += renderPortfolio(paper, false, item);
          viewing.textContent = runDetail ? paper.name + &#x27; · Run &#x27; + runDetail.id : &#x27;Paper · &#x27; + paper.name + &#x27; · Strategy &#x27; + paper.version;
        }
        topState.textContent = viewing.textContent;
      }
      main.innerHTML = html;
      attachEvents();
    }

    liveButton.addEventListener(&quot;click&quot;, function () { environment = { kind: &quot;live&quot;, paperId: null }; localView = &quot;overview&quot;; runDetail = null; render(); });
    root.querySelector(&quot;#pew-champion&quot;).addEventListener(&quot;change&quot;, function (event) {
      championId = event.target.value;
      selectedStrategyId = champion().strategies[0].id;
      var firstPaper = selectedStrategy().papers[0];
      environment = firstPaper ? { kind: &quot;paper&quot;, paperId: firstPaper.id } : { kind: &quot;draft&quot;, paperId: null };
      localView = firstPaper ? &quot;overview&quot; : &quot;strategy&quot;;
      runDetail = null;
      render();
    });
    root.querySelector(&quot;#pew-new-strategy&quot;).addEventListener(&quot;click&quot;, function () { selectedStrategyId = champion().strategies[champion().strategies.length - 1].id; environment = { kind: &quot;draft&quot;, paperId: null }; localView = &quot;strategy&quot;; runDetail = null; render(); });
    root.querySelector(&quot;#pew-composer&quot;).addEventListener(&quot;submit&quot;, function (event) {
      event.preventDefault();
      var field = root.querySelector(&quot;#pew-message&quot;);
      if (!field.value.trim()) return;
      var message = document.createElement(&quot;div&quot;);
      message.className = &quot;pew-message pew-message-user&quot;;
      message.textContent = field.value.trim();
      root.querySelector(&quot;#pew-chat-log&quot;).appendChild(message);
      field.value = &quot;&quot;;
    });

    render();
  })();
&lt;/script&gt;
