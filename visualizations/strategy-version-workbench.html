    var viewing = root.querySelector(&quot;#vvw-viewing&quot;);
    var writeTarget = root.querySelector(&quot;#vvw-write-target&quot;);
    var topTarget = root.querySelector(&quot;#vvw-top-target&quot;);

    function strategyById(id) {
      return strategies.find(function (strategy) { return strategy.id === id; });
    }

    function selectedStrategy() {
      return strategyById(selectedStrategyId);
    }

    function renderStrategyList() {
      strategyList.innerHTML = &quot;&quot;;
      strategies.forEach(function (strategy) {
        var button = document.createElement(&quot;button&quot;);
        button.type = &quot;button&quot;;
        button.className = &quot;btn btn-block vvw-strategy-button&quot;;
        button.setAttribute(&quot;aria-pressed&quot;, strategy.id === selectedStrategyId ? &quot;true&quot; : &quot;false&quot;);
        button.innerHTML = &#x27;&lt;span class=&quot;vvw-dot &#x27; + (strategy.id === selectedStrategyId ? &quot;vvw-dot-on&quot; : &quot;&quot;) + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;vvw-strategy-copy&quot;&gt;&lt;span&gt;&#x27; + strategy.name + &#x27;&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + strategy.draft + &#x27; · &#x27; + (strategy.pending ? strategy.pending + &quot; changes&quot; : &quot;Tested&quot;) + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27;;
        button.addEventListener(&quot;click&quot;, function () {
          selectedStrategyId = strategy.id;
          destination = { kind: &quot;work&quot;, view: &quot;strategy&quot; };
          selectedRuleIndex = 0;
          render();
        });
        strategyList.appendChild(button);
      });
    }

    function workTab(view, label) {
      var selected = destination.kind === &quot;work&quot; &amp;&amp; destination.view === view;
      return &#x27;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-work-view=&quot;&#x27; + view + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + label + &#x27;&lt;/button&gt;&#x27;;
    }

    function renderTop(strategy) {
      var status = strategy.pending ? strategy.pending + &quot; untested changes&quot; : &quot;Tested at &quot; + strategy.checkpoint;
      return &#x27;&lt;div class=&quot;vvw-title-row&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;&#x27; + strategy.name + &#x27; / &#x27; + strategy.draft + &#x27; / &#x27; + strategy.checkpoint + &#x27;&lt;/p&gt;&lt;h2&gt;&#x27; + strategy.title + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;&#x27; + status + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;vvw-toolbar&quot;&gt;&lt;nav class=&quot;vvw-work-tabs&quot; aria-label=&quot;Strategy work&quot;&gt;&#x27; + workTab(&quot;strategy&quot;, &quot;Strategy&quot;) + workTab(&quot;history&quot;, &quot;History&quot;) + workTab(&quot;tests&quot;, &quot;Tests&quot;) + workTab(&quot;datasets&quot;, &quot;Datasets&quot;) + &#x27;&lt;/nav&gt;&lt;div class=&quot;vvw-toolbar-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-work-view=&quot;history&quot;&gt;Compare&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;vvw-test&quot;&gt;Test&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
    }

    function renderPortfolioStrip() {
      var buttons = portfolios.map(function (portfolio) {
        var controlling = strategyById(portfolio.strategyId);
        var selected = destination.kind === &quot;portfolio&quot; &amp;&amp; destination.portfolioId === portfolio.id;
        var dotClass = portfolio.state === &quot;Active&quot; || portfolio.state === &quot;Running&quot; ? &quot;vvw-dot-on&quot; : &quot;&quot;;
        return &#x27;&lt;button type=&quot;button&quot; class=&quot;btn vvw-portfolio-button&quot; data-portfolio-id=&quot;&#x27; + portfolio.id + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&lt;span class=&quot;vvw-portfolio-main&quot;&gt;&lt;span class=&quot;vvw-dot &#x27; + dotClass + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;&#x27; + portfolio.mode + &#x27; · &#x27; + portfolio.name + &#x27;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + controlling.name + &#x27; · &#x27; + portfolio.version.replace(&quot;Strategy &quot;, &quot;V&quot;) + &#x27; · &#x27; + portfolio.state + &#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;
      }).join(&quot;&quot;);
      return &#x27;&lt;nav class=&quot;vvw-portfolio-strip&quot; aria-label=&quot;Live and Paper portfolios&quot;&gt;&lt;div class=&quot;vvw-portfolio-row&quot;&gt;&#x27; + buttons + &#x27;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; id=&quot;vvw-new-paper&quot;&gt;New Paper&lt;/button&gt;&lt;/div&gt;&lt;/nav&gt;&#x27;;
    }

    function table(rows, caption) {
      return &#x27;&lt;table class=&quot;vvw-table&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;&#x27; + caption + &#x27;&lt;/caption&gt;&lt;tbody&gt;&#x27; + rows.map(function (row) {
        return &#x27;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&#x27; + row[0] + &#x27;&lt;/th&gt;&lt;td&gt;&#x27; + row[1] + &#x27;&lt;/td&gt;&lt;td class=&quot;text-muted&quot;&gt;&#x27; + row[2] + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      }).join(&quot;&quot;) + &#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
    }

    function renderStrategyPane(strategy) {
      var rows = strategy.rules.map(function (rule, index) {
        var selected = index === selectedRuleIndex;
        return &#x27;&lt;tr&gt;&lt;td class=&quot;vvw-line&quot;&gt;&#x27; + rule.line + &#x27;&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;vvw-rule-button&quot; data-rule-index=&quot;&#x27; + index + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + rule.section + &#x27;&lt;/button&gt;&lt;/th&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;vvw-rule-button&quot; data-rule-index=&quot;&#x27; + index + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + rule.value + &#x27;&lt;/button&gt;&lt;/td&gt;&lt;td class=&quot;vvw-evidence-cell text-small &#x27; + (rule.evidence === &quot;Untested&quot; ? &quot;text-destructive&quot; : &quot;text-muted&quot;) + &#x27;&quot;&gt;&#x27; + rule.evidence + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      }).join(&quot;&quot;);
      var rule = strategy.rules[selectedRuleIndex] || strategy.rules[0];
      return &#x27;&lt;section class=&quot;vvw-pane&quot;&gt;&lt;div class=&quot;vvw-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Structured strategy&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Editable · autosaved&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Edit rule&lt;/button&gt;&lt;/div&gt;&lt;table class=&quot;vvw-editor&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;Editable strategy rules and latest evidence&lt;/caption&gt;&lt;tbody&gt;&#x27; + rows + &#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;vvw-output&quot;&gt;&lt;div class=&quot;vvw-output-head&quot;&gt;&lt;strong&gt;&#x27; + rule.section + &#x27;&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Evidence&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;vvw-output-grid&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Change&lt;/span&gt;&lt;strong&gt;&#x27; + rule.delta + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Latest test&lt;/span&gt;&lt;strong&gt;&#x27; + rule.test + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Cutoff&lt;/span&gt;&lt;strong&gt;&#x27; + rule.cutoff + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#x27;;
    }

    function renderHistoryPane(strategy) {
      return &#x27;&lt;section class=&quot;vvw-pane&quot;&gt;&lt;div class=&quot;vvw-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;History&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Draft checkpoints&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Compare selected&lt;/button&gt;&lt;/div&gt;&#x27; + table(strategy.checkpoints, &quot;Draft checkpoints&quot;) + &#x27;&lt;div class=&quot;vvw-output&quot;&gt;&lt;div class=&quot;vvw-output-head&quot;&gt;&lt;strong&gt;Frozen strategies&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Read-only&lt;/span&gt;&lt;/div&gt;&#x27; + table(strategy.versions, &quot;Immutable strategy versions&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;
    }

    function renderTestsPane(strategy) {
      var v = strategy.checkpoint;
      return &#x27;&lt;section class=&quot;vvw-pane&quot;&gt;&lt;div class=&quot;vvw-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Tests&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Pinned to &#x27; + v + &#x27;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;vvw-toolbar-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Backtest&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot;&gt;Dry run&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27; + table([[&quot;Dry Run 12&quot;, v, &quot;No trade · constraints held&quot;], [&quot;Backtest 18&quot;, &quot;V6.3&quot;, &quot;+11.8% · max drawdown 8.4%&quot;], [&quot;Dry Run 11&quot;, &quot;V6.3&quot;, &quot;2 proposed orders&quot;]], &quot;Strategy tests&quot;) + &#x27;&lt;/section&gt;&#x27;;
    }

    function renderDatasetsPane() {
      return &#x27;&lt;section class=&quot;vvw-pane&quot;&gt;&lt;div class=&quot;vvw-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Datasets&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Inputs and cutoffs&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Manage&lt;/button&gt;&lt;/div&gt;&#x27; + table([[&quot;Daily prices&quot;, &quot;Adjusted OHLCV&quot;, &quot;Jul 14&quot;], [&quot;Fundamentals&quot;, &quot;Quarterly company data&quot;, &quot;Q1&quot;], [&quot;Benchmark&quot;, &quot;S&amp;P 500 total return&quot;, &quot;Comparison only&quot;]], &quot;Strategy datasets&quot;) + &#x27;&lt;/section&gt;&#x27;;
    }

    function renderWorkPane(strategy) {
      if (destination.view === &quot;history&quot;) return renderHistoryPane(strategy);
      if (destination.view === &quot;tests&quot;) return renderTestsPane(strategy);
      if (destination.view === &quot;datasets&quot;) return renderDatasetsPane(strategy);
      return renderStrategyPane(strategy);
    }

    function localTab(view, label, selected) {
      return &#x27;&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-portfolio-view=&quot;&#x27; + view + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + label + &#x27;&lt;/button&gt;&#x27;;
    }

    function equityChart(portfolio) {
      return &#x27;&lt;svg class=&quot;vvw-equity&quot; viewBox=&quot;0 0 420 118&quot; role=&quot;img&quot; aria-label=&quot;Discrete account value observations across eight completed runs&quot;&gt;&lt;title&gt;Account value by completed run&lt;/title&gt;&lt;line class=&quot;vvw-gridline&quot; x1=&quot;8&quot; y1=&quot;92&quot; x2=&quot;412&quot; y2=&quot;92&quot;&gt;&lt;/line&gt;&lt;line class=&quot;vvw-gridline&quot; x1=&quot;8&quot; y1=&quot;48&quot; x2=&quot;412&quot; y2=&quot;48&quot;&gt;&lt;/line&gt;&lt;path class=&quot;vvw-equity-line&quot; d=&quot;M12 87 L68 82 L124 85 L180 68 L236 72 L292 51 L348 44 L408 30&quot;&gt;&lt;/path&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;12&quot; cy=&quot;87&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;68&quot; cy=&quot;82&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;124&quot; cy=&quot;85&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;180&quot; cy=&quot;68&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;236&quot; cy=&quot;72&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;292&quot; cy=&quot;51&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;348&quot; cy=&quot;44&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vvw-run-mark&quot; cx=&quot;408&quot; cy=&quot;30&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;text x=&quot;12&quot; y=&quot;111&quot; class=&quot;text-small&quot; fill=&quot;var(--muted-foreground)&quot;&gt;Run &#x27; + Math.max(1, portfolio.runs - 7) + &#x27;&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;111&quot; class=&quot;text-small&quot; fill=&quot;var(--muted-foreground)&quot;&gt;Run &#x27; + portfolio.runs + &#x27;&lt;/text&gt;&lt;/svg&gt;&#x27;;
    }

    function renderPortfolioContent(portfolio, controlling) {
      if (portfolioView === &quot;runs&quot;) return table([[&quot;Run &quot; + portfolio.runs, &quot;Friday close&quot;, &quot;No trade · constraints held&quot;], [&quot;Run &quot; + (portfolio.runs - 1), &quot;Prior Friday&quot;, &quot;Rebalanced 2 positions&quot;], [&quot;Run &quot; + (portfolio.runs - 2), &quot;Prior Friday&quot;, &quot;No trade · earnings filter&quot;]], &quot;Portfolio runs&quot;);
      if (portfolioView === &quot;positions&quot;) return table([[&quot;MSFT&quot;, &quot;18.2%&quot;, &quot;+4.1%&quot;], [&quot;NVDA&quot;, &quot;14.7%&quot;, &quot;+1.8%&quot;], [&quot;Cash&quot;, &quot;36.0%&quot;, &quot;Available&quot;]], &quot;Portfolio positions&quot;);
      if (portfolioView === &quot;orders&quot;) return table([[&quot;Latest run&quot;, &quot;No order&quot;, &quot;Constraints held&quot;], [&quot;Previous&quot;, &quot;SELL 4 MSFT&quot;, &quot;Filled&quot;], [&quot;Previous&quot;, &quot;BUY 6 NVDA&quot;, &quot;Filled&quot;]], &quot;Portfolio orders&quot;);
      if (portfolioView === &quot;strategy&quot;) return table([[portfolio.version, controlling.title, &quot;Immutable&quot;], [&quot;Source&quot;, &quot;Draft &quot; + portfolio.checkpoint, &quot;Frozen&quot;], [&quot;Current Draft&quot;, controlling.draft + &quot; · &quot; + controlling.checkpoint, &quot;Separate&quot;]], &quot;Controlling strategy provenance&quot;);
      return &#x27;&lt;div class=&quot;vvw-stats&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Value&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.value + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Return&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.change + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Runs&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.runs + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&#x27; + equityChart(portfolio) + table([[&quot;Latest run&quot;, &quot;No trade&quot;, &quot;Constraints held&quot;], [&quot;Next run&quot;, &quot;Friday close&quot;, portfolio.state], [&quot;Positions&quot;, String(portfolio.positions), &quot;Current&quot;]], &quot;Portfolio summary&quot;);
    }

    function renderPortfolioPane(strategy, portfolio) {
      var controlling = strategyById(portfolio.strategyId);
      var selectedMismatch = controlling.id !== strategy.id;
      return &#x27;&lt;section class=&quot;vvw-pane&quot;&gt;&lt;div class=&quot;vvw-portfolio-title&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;&#x27; + portfolio.mode + &#x27; / &#x27; + portfolio.state + &#x27;&lt;/p&gt;&lt;h2&gt;&#x27; + portfolio.name + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;&#x27; + portfolio.state + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;vvw-provenance&quot;&gt;&lt;div class=&quot;vvw-trail&quot;&gt;&lt;span&gt;&#x27; + controlling.name + &#x27;&lt;/span&gt;&lt;span class=&quot;vvw-arrow&quot;&gt;→&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.version + &#x27;&lt;/strong&gt;&lt;span class=&quot;vvw-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;&#x27; + portfolio.mode + &#x27; deployment&lt;/span&gt;&lt;span class=&quot;vvw-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;Run &#x27; + portfolio.runs + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; + (selectedMismatch ? &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;vvw-open-controller&quot;&gt;Open &#x27; + controlling.name + &#x27;&lt;/button&gt;&#x27; : &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-work-view=&quot;strategy&quot;&gt;Open Draft&lt;/button&gt;&#x27;) + &#x27;&lt;/div&gt;&lt;nav class=&quot;vvw-local-tabs&quot; aria-label=&quot;Portfolio views&quot;&gt;&#x27; + localTab(&quot;overview&quot;, &quot;Overview&quot;, portfolioView === &quot;overview&quot;) + localTab(&quot;runs&quot;, &quot;Runs · &quot; + portfolio.runs, portfolioView === &quot;runs&quot;) + localTab(&quot;positions&quot;, &quot;Positions&quot;, portfolioView === &quot;positions&quot;) + localTab(&quot;orders&quot;, &quot;Orders&quot;, portfolioView === &quot;orders&quot;) + localTab(&quot;strategy&quot;, &quot;Strategy&quot;, portfolioView === &quot;strategy&quot;) + &#x27;&lt;/nav&gt;&#x27; + renderPortfolioContent(portfolio, controlling) + &#x27;&lt;/section&gt;&#x27;;
    }

    function attachEvents() {
      root.querySelectorAll(&quot;[data-work-view]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          destination = { kind: &quot;work&quot;, view: button.getAttribute(&quot;data-work-view&quot;) };
          render();
        });
      });
      root.querySelectorAll(&quot;[data-portfolio-id]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          destination = { kind: &quot;portfolio&quot;, portfolioId: button.getAttribute(&quot;data-portfolio-id&quot;) };
          portfolioView = &quot;overview&quot;;
          render();
        });
      });
      root.querySelectorAll(&quot;[data-rule-index]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          selectedRuleIndex = Number(button.getAttribute(&quot;data-rule-index&quot;));
          render();
        });
      });
      root.querySelectorAll(&quot;[data-portfolio-view]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () {
          portfolioView = button.getAttribute(&quot;data-portfolio-view&quot;);
          render();
        });
      });
      var openController = root.querySelector(&quot;#vvw-open-controller&quot;);
      if (openController) {
        openController.addEventListener(&quot;click&quot;, function () {
          var portfolio = portfolios.find(function (item) { return item.id === destination.portfolioId; });
          if (portfolio) selectedStrategyId = portfolio.strategyId;
          destination = { kind: &quot;work&quot;, view: &quot;strategy&quot; };
          selectedRuleIndex = 0;
          render();
        });
      }
    }

    function render() {
      var strategy = selectedStrategy();
      renderStrategyList();
      workspace.innerHTML = renderTop(strategy) + renderPortfolioStrip();
      writeTarget.textContent = strategy.name + &quot; · &quot; + strategy.checkpoint;
      topTarget.textContent = &quot;Editing &quot; + strategy.name + &quot; · &quot; + strategy.checkpoint;

      if (destination.kind === &quot;portfolio&quot;) {
        var portfolio = portfolios.find(function (item) { return item.id === destination.portfolioId; });
        if (portfolio) {
          workspace.innerHTML += renderPortfolioPane(strategy, portfolio);
          viewing.textContent = portfolio.mode + &quot; · &quot; + portfolio.name + &quot; · &quot; + portfolio.version;
        } else {
          destination = { kind: &quot;work&quot;, view: &quot;strategy&quot; };
          workspace.innerHTML += renderWorkPane(strategy);
          viewing.textContent = strategy.name + &quot; · &quot; + strategy.draft;
        }
      } else {
        workspace.innerHTML += renderWorkPane(strategy);
        viewing.textContent = strategy.name + &quot; · &quot; + strategy.draft + &quot; · &quot; + strategy.checkpoint;
      }
      attachEvents();
    }

    root.querySelector(&quot;#vvw-new-strategy&quot;).addEventListener(&quot;click&quot;, function () {
      selectedStrategyId = &quot;income&quot;;
      destination = { kind: &quot;work&quot;, view: &quot;strategy&quot; };
      selectedRuleIndex = 0;
      render();
    });

    root.querySelector(&quot;#vvw-composer&quot;).addEventListener(&quot;submit&quot;, function (event) {
      event.preventDefault();
      var field = root.querySelector(&quot;#vvw-message&quot;);
      if (!field.value.trim()) return;
      var item = document.createElement(&quot;div&quot;);
      item.className = &quot;vvw-message vvw-user-message&quot;;
      item.textContent = field.value.trim();
      root.querySelector(&quot;#vvw-chat-log&quot;).appendChild(item);
      field.value = &quot;&quot;;
    });

    render();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
