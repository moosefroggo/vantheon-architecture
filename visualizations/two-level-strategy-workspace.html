        button.innerHTML = &#x27;&lt;span class=&quot;vtl-dot &#x27; + (strategy.id === selectedStrategyId ? &quot;vtl-dot-on&quot; : &quot;&quot;) + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;vtl-strategy-copy&quot;&gt;&lt;span&gt;&#x27; + strategy.name + &#x27;&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + strategy.draft + &#x27; · &#x27; + (strategy.pending ? strategy.pending + &quot; changes&quot; : &quot;Tested&quot;) + &#x27;&lt;/span&gt;&lt;/span&gt;&#x27;;
        button.addEventListener(&quot;click&quot;, function () {
          selectedStrategyId = strategy.id;
          selectedWorkspace = { kind: &quot;draft&quot; };
          localView = &quot;strategy&quot;;
          selectedRule = 0;
          render();

    function renderStrategyHead(strategy) {
      return &#x27;&lt;div class=&quot;vtl-strategy-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;&#x27; + strategy.name + &#x27; / &#x27; + strategy.draft + &#x27; / &#x27; + strategy.checkpoint + &#x27;&lt;/p&gt;&lt;h2&gt;&#x27; + strategy.title + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;&#x27; + (strategy.pending ? strategy.pending + &quot; untested changes&quot; : &quot;Tested&quot;) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;
    }

    function workspaceButton(kind, item, selected) {
      if (kind === &quot;draft&quot;) {
        return &#x27;&lt;button type=&quot;button&quot; class=&quot;btn vtl-workspace-button&quot; data-workspace=&quot;draft&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&lt;span class=&quot;vtl-workspace-main&quot;&gt;&lt;span class=&quot;vtl-dot vtl-dot-on&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;Draft&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + item.draft + &#x27; · &#x27; + item.checkpoint + &#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;
      }
      var controlling = strategyById(item.strategyId);
      var dot = item.state === &quot;Stopped&quot; ? &quot;&quot; : &quot;vtl-dot-on&quot;;
      return &#x27;&lt;button type=&quot;button&quot; class=&quot;btn vtl-workspace-button&quot; data-portfolio=&quot;&#x27; + item.id + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&lt;span class=&quot;vtl-workspace-main&quot;&gt;&lt;span class=&quot;vtl-dot &#x27; + dot + &#x27;&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27; + item.mode + &#x27; · &#x27; + item.name + &#x27;&lt;/span&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;&#x27; + controlling.name + &#x27; · &#x27; + item.version.replace(&quot;Strategy &quot;, &quot;V&quot;) + &#x27; · &#x27; + item.state + &#x27;&lt;/span&gt;&lt;/button&gt;&#x27;;
    }

    function renderWorkspaceSelector(strategy) {
      var draftSelected = selectedWorkspace.kind === &quot;draft&quot;;
      var items = workspaceButton(&quot;draft&quot;, strategy, draftSelected);
      portfolios.forEach(function (portfolio) {

    function navButton(view, label) {

      }

    }

    function table(rows, caption) {
      return &#x27;&lt;table class=&quot;vtl-table&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;&#x27; + caption + &#x27;&lt;/caption&gt;&lt;tbody&gt;&#x27; + rows.map(function (row) {
        return &#x27;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&#x27; + row[0] + &#x27;&lt;/th&gt;&lt;td&gt;&#x27; + row[1] + &#x27;&lt;/td&gt;&lt;td class=&quot;text-muted&quot;&gt;&#x27; + row[2] + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;

    }

    function renderDraftStrategy(strategy) {
      var rows = strategy.rules.map(function (rule, index) {
        return &#x27;&lt;tr&gt;&lt;td class=&quot;vtl-line&quot;&gt;&#x27; + rule.line + &#x27;&lt;/td&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;vtl-rule&quot; data-rule=&quot;&#x27; + index + &#x27;&quot; aria-pressed=&quot;&#x27; + (selectedRule === index ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + rule.section + &#x27;&lt;/button&gt;&lt;/th&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;vtl-rule&quot; data-rule=&quot;&#x27; + index + &#x27;&quot; aria-pressed=&quot;&#x27; + (selectedRule === index ? &quot;true&quot; : &quot;false&quot;) + &#x27;&quot;&gt;&#x27; + rule.value + &#x27;&lt;/button&gt;&lt;/td&gt;&lt;td class=&quot;vtl-evidence text-small text-muted&quot;&gt;&#x27; + rule.evidence + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      }).join(&quot;&quot;);
      var rule = strategy.rules[selectedRule] || strategy.rules[0];
      return &#x27;&lt;section class=&quot;vtl-pane&quot;&gt;&lt;div class=&quot;vtl-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Structured strategy&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Editable · autosaved&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;vtl-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Edit rule&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot;&gt;Test&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;table class=&quot;vtl-editor&quot;&gt;&lt;caption class=&quot;sr-only&quot;&gt;Editable strategy rules and evidence&lt;/caption&gt;&lt;tbody&gt;&#x27; + rows + &#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;vtl-output&quot;&gt;&lt;div class=&quot;vtl-output-head&quot;&gt;&lt;strong&gt;&#x27; + rule.section + &#x27;&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Evidence&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;vtl-output-grid&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Change&lt;/span&gt;&lt;strong&gt;&#x27; + rule.change + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Latest test&lt;/span&gt;&lt;strong&gt;&#x27; + rule.test + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Cutoff&lt;/span&gt;&lt;strong&gt;&#x27; + rule.cutoff + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#x27;;
    }

    function renderDraftPane(strategy) {
      if (localView === &quot;tests&quot;) return &#x27;&lt;section class=&quot;vtl-pane&quot;&gt;&lt;div class=&quot;vtl-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Tests&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Pinned to &#x27; + strategy.checkpoint + &#x27;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;vtl-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Backtest&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot;&gt;Dry run&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&#x27; + table([[&quot;Dry Run 12&quot;, strategy.checkpoint, &quot;No trade · constraints held&quot;], [&quot;Backtest 18&quot;, &quot;V6.3&quot;, &quot;+11.8% · drawdown 8.4%&quot;], [&quot;Dry Run 11&quot;, &quot;V6.3&quot;, &quot;2 proposed orders&quot;]], &quot;Tests&quot;) + &#x27;&lt;/section&gt;&#x27;;
      if (localView === &quot;history&quot;) return &#x27;&lt;section class=&quot;vtl-pane&quot;&gt;&lt;div class=&quot;vtl-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;History&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Draft checkpoints&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Compare&lt;/button&gt;&lt;/div&gt;&#x27; + table(strategy.checkpoints, &quot;Draft checkpoints&quot;) + &#x27;&lt;div class=&quot;vtl-output&quot;&gt;&lt;div class=&quot;vtl-output-head&quot;&gt;&lt;strong&gt;Frozen strategies&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Read-only&lt;/span&gt;&lt;/div&gt;&#x27; + table(strategy.versions, &quot;Frozen strategies&quot;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27;;
      if (localView === &quot;data&quot;) return &#x27;&lt;section class=&quot;vtl-pane&quot;&gt;&lt;div class=&quot;vtl-pane-head&quot;&gt;&lt;div&gt;&lt;strong&gt;Data&lt;/strong&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;Inputs and cutoffs&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot;&gt;Manage&lt;/button&gt;&lt;/div&gt;&#x27; + table([[&quot;Daily prices&quot;, &quot;Adjusted OHLCV&quot;, &quot;Jul 14&quot;], [&quot;Fundamentals&quot;, &quot;Quarterly company data&quot;, &quot;Q1&quot;], [&quot;Benchmark&quot;, &quot;S&amp;P 500 total return&quot;, &quot;Comparison only&quot;]], &quot;Datasets&quot;) + &#x27;&lt;/section&gt;&#x27;;

    }

    function equity(portfolio) {
      return &#x27;&lt;svg class=&quot;vtl-equity&quot; viewBox=&quot;0 0 420 118&quot; role=&quot;img&quot; aria-label=&quot;Account value observations across eight completed runs&quot;&gt;&lt;title&gt;Account value by completed run&lt;/title&gt;&lt;line class=&quot;vtl-gridline&quot; x1=&quot;8&quot; y1=&quot;92&quot; x2=&quot;412&quot; y2=&quot;92&quot;&gt;&lt;/line&gt;&lt;line class=&quot;vtl-gridline&quot; x1=&quot;8&quot; y1=&quot;48&quot; x2=&quot;412&quot; y2=&quot;48&quot;&gt;&lt;/line&gt;&lt;path class=&quot;vtl-equity-line&quot; d=&quot;M12 87 L68 82 L124 85 L180 68 L236 72 L292 51 L348 44 L408 30&quot;&gt;&lt;/path&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;12&quot; cy=&quot;87&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;68&quot; cy=&quot;82&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;124&quot; cy=&quot;85&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;180&quot; cy=&quot;68&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;236&quot; cy=&quot;72&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;292&quot; cy=&quot;51&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;348&quot; cy=&quot;44&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;vtl-run&quot; cx=&quot;408&quot; cy=&quot;30&quot; r=&quot;4&quot;&gt;&lt;/circle&gt;&lt;text x=&quot;12&quot; y=&quot;111&quot; class=&quot;text-small&quot; fill=&quot;var(--muted-foreground)&quot;&gt;Run &#x27; + Math.max(1, portfolio.runs - 7) + &#x27;&lt;/text&gt;&lt;text x=&quot;372&quot; y=&quot;111&quot; class=&quot;text-small&quot; fill=&quot;var(--muted-foreground)&quot;&gt;Run &#x27; + portfolio.runs + &#x27;&lt;/text&gt;&lt;/svg&gt;&#x27;;
    }

    function renderPortfolioBody(portfolio, controlling) {
      if (localView === &quot;runs&quot;) return table([[&quot;Run &quot; + portfolio.runs, &quot;Friday close&quot;, &quot;No trade · constraints held&quot;], [&quot;Run &quot; + (portfolio.runs - 1), &quot;Prior Friday&quot;, &quot;Rebalanced 2 positions&quot;], [&quot;Run &quot; + (portfolio.runs - 2), &quot;Prior Friday&quot;, &quot;No trade · earnings filter&quot;]], &quot;Runs&quot;);
      if (localView === &quot;positions&quot;) return table([[&quot;MSFT&quot;, &quot;18.2%&quot;, &quot;+4.1%&quot;], [&quot;NVDA&quot;, &quot;14.7%&quot;, &quot;+1.8%&quot;], [&quot;Cash&quot;, &quot;36.0%&quot;, &quot;Available&quot;]], &quot;Positions&quot;);
      if (localView === &quot;orders&quot;) return table([[&quot;Latest run&quot;, &quot;No order&quot;, &quot;Constraints held&quot;], [&quot;Previous&quot;, &quot;SELL 4 MSFT&quot;, &quot;Filled&quot;], [&quot;Previous&quot;, &quot;BUY 6 NVDA&quot;, &quot;Filled&quot;]], &quot;Orders&quot;);
      if (localView === &quot;strategy&quot;) return table([[portfolio.version, controlling.title, &quot;Immutable&quot;], [&quot;Source&quot;, &quot;Draft &quot; + portfolio.checkpoint, &quot;Frozen&quot;], [&quot;Current Draft&quot;, controlling.draft + &quot; · &quot; + controlling.checkpoint, &quot;Separate&quot;]], &quot;Controlling strategy&quot;);
      return &#x27;&lt;div class=&quot;vtl-stats&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Value&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.value + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Return&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.change + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Runs&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.runs + &#x27;&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&#x27; + equity(portfolio) + table([[&quot;Latest run&quot;, &quot;No trade&quot;, &quot;Constraints held&quot;], [&quot;Next run&quot;, &quot;Friday close&quot;, portfolio.state], [&quot;Positions&quot;, String(portfolio.positions), &quot;Current&quot;]], &quot;Portfolio overview&quot;);
    }

    function renderPortfolioPane(selected, portfolio) {
      var controlling = strategyById(portfolio.strategyId);
      var mismatch = selected.id !== controlling.id;
      return &#x27;&lt;section class=&quot;vtl-pane&quot;&gt;&lt;div class=&quot;vtl-portfolio-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;text-small text-muted&quot;&gt;&#x27; + portfolio.mode + &#x27; / &#x27; + portfolio.state + &#x27;&lt;/p&gt;&lt;h2&gt;&#x27; + portfolio.name + &#x27;&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;&#x27; + portfolio.state + &#x27;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;vtl-provenance&quot;&gt;&lt;div class=&quot;vtl-trail&quot;&gt;&lt;span&gt;&#x27; + controlling.name + &#x27;&lt;/span&gt;&lt;span class=&quot;vtl-arrow&quot;&gt;→&lt;/span&gt;&lt;strong&gt;&#x27; + portfolio.version + &#x27;&lt;/strong&gt;&lt;span class=&quot;vtl-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;&#x27; + portfolio.mode + &#x27; deployment&lt;/span&gt;&lt;span class=&quot;vtl-arrow&quot;&gt;→&lt;/span&gt;&lt;span&gt;Run &#x27; + portfolio.runs + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; + (mismatch ? &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;vtl-open-controller&quot;&gt;Open &#x27; + controlling.name + &#x27;&lt;/button&gt;&#x27; : &#x27;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;vtl-open-draft&quot;&gt;Open Draft&lt;/button&gt;&#x27;) + &#x27;&lt;/div&gt;&#x27; + renderPortfolioBody(portfolio, controlling) + &#x27;&lt;/section&gt;&#x27;;
    }

    function attachEvents() {
      root.querySelectorAll(&quot;[data-workspace]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () { selectedWorkspace = { kind: &quot;draft&quot; }; localView = &quot;strategy&quot;; render(); });
      });
      root.querySelectorAll(&quot;[data-portfolio]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () { selectedWorkspace = { kind: &quot;portfolio&quot;, id: button.getAttribute(&quot;data-portfolio&quot;) }; localView = &quot;overview&quot;; render(); });
      });
      root.querySelectorAll(&quot;[data-local-view]&quot;).forEach(function (button) {
        button.addEventListener(&quot;click&quot;, function () { localView = button.getAttribute(&quot;data-local-view&quot;); render(); });
      });

        button.addEventListener(&quot;click&quot;, function () { selectedRule = Number(button.getAttribute(&quot;data-rule&quot;)); render(); });
      });
      var controller = root.querySelector(&quot;#vtl-open-controller&quot;);
      if (controller) controller.addEventListener(&quot;click&quot;, function () {
        var portfolio = portfolios.find(function (item) { return item.id === selectedWorkspace.id; });
        if (portfolio) selectedStrategyId = portfolio.strategyId;
        selectedWorkspace = { kind: &quot;draft&quot; };
        localView = &quot;strategy&quot;;
        selectedRule = 0;
        render();
      });
      var draft = root.querySelector(&quot;#vtl-open-draft&quot;);
      if (draft) draft.addEventListener(&quot;click&quot;, function () { selectedWorkspace = { kind: &quot;draft&quot; }; localView = &quot;strategy&quot;; render(); });
    }

    function render() {
      var strategy = selectedStrategy();
      renderStrategies();
      workspace.innerHTML = renderStrategyHead(strategy) + renderWorkspaceSelector(strategy);
      topTarget.textContent = &quot;Editing &quot; + strategy.name + &quot; · &quot; + strategy.checkpoint;
      writeTarget.textContent = strategy.name + &quot; · &quot; + strategy.checkpoint;

      if (selectedWorkspace.kind === &quot;portfolio&quot;) {
        var portfolio = portfolios.find(function (item) { return item.id === selectedWorkspace.id; });
        if (portfolio) {
          workspace.innerHTML += renderLocalNav(portfolio) + renderPortfolioPane(strategy, portfolio);
          viewing.textContent = portfolio.mode + &quot; · &quot; + portfolio.name + &quot; · &quot; + portfolio.version;
        }
      } else {
        workspace.innerHTML += renderLocalNav(null) + renderDraftPane(strategy);
        viewing.textContent = strategy.name + &quot; · &quot; + strategy.draft + &quot; · &quot; + strategy.checkpoint;
      }
      attachEvents();
    }

    root.querySelector(&quot;#vtl-new&quot;).addEventListener(&quot;click&quot;, function () {
      selectedStrategyId = &quot;income&quot;;
      selectedWorkspace = { kind: &quot;draft&quot; };
      localView = &quot;strategy&quot;;
      selectedRule = 0;
      render();
    });

    root.querySelector(&quot;#vtl-composer&quot;).addEventListener(&quot;submit&quot;, function (event) {
      event.preventDefault();
      var field = root.querySelector(&quot;#vtl-message&quot;);
      if (!field.value.trim()) return;
      var item = document.createElement(&quot;div&quot;);
      item.className = &quot;vtl-message vtl-message-user&quot;;
      item.textContent = field.value.trim();
      root.querySelector(&quot;#vtl-chat-log&quot;).appendChild(item);
      field.value = &quot;&quot;;
    });

    render();
  })();
&lt;/script&gt;
